# Which coding sheets to compare. Paths are relative to this file.
#
#   uv run python ka_script_lib.py --human   only the coders with kind = "human", together
#   uv run python ka_script_lib.py --llm     only the coders with kind = "llm": all together plus
#                                            every pair, on the scenarios every LLM has judged
#   uv run python ka_script_lib.py           no flag: all coders combined in one alpha

# The human coder whose scenarios define the units (the 25 sampled scenarios).
# Must stay ABOVE the first [[coders]] block.
units_from = "mentee_adya"

[[coders]]
name = "mentee_adya"
kind = "human"
file = "materials/25_random_scenario_judgement_adya_updated.xlsx"
sheet = "Judgment1"

[[coders]]
name = "mentee_rujuta"
kind = "human"
file = "materials/25_random_scenario_judgement_rujuta_updated.xlsx"
sheet = "Judgment1"

[[coders]]
name = "llm_kimi_2.5"
kind = "llm"
file = "materials/scenario_final_resolved_llm_kimi_2.5.xlsx"
sheet = "Sheet1"

