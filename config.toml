# Which coding sheets to compare.

# The coder whose scenarios define the units (the 25 sampled scenarios).
# Must stay ABOVE the first [[coders]] block.
units_from = "mentee_adya"

[[coders]]
name = "llm_kimi"
file = "materials/scenario_final_resolved_llm_kimi.xlsx"
sheet = "Sheet1"

[[coders]]
name = "mentee_adya"
file = "materials/25_random_scenario_judgement_adya.xlsx"
sheet = "Judgment1"

[[coders]]
name = "mentee_rujuta"
file = "materials/25_random_scenario_judgement_rujuta.xlsx"
sheet = "Judgment1"

# Each comparison computes alpha over the listed coders.
# Run all:   uv run python -m krippendorff_python_lib.ka_script_lib
# Run only humans (mentees):  uv run python -m krippendorff_python_lib.ka_script_lib --only humans

# MAIN RESULT: human vs human, i.e. is the codebook reliable?
[[comparisons]]
name = "humans"
coders = ["mentee_adya", "mentee_rujuta"]

[[comparisons]]
name = "adya_vs_llm"
coders = ["mentee_adya", "llm_kimi"]

[[comparisons]]
name = "rujuta_vs_llm"
coders = ["mentee_rujuta", "llm_kimi"]

# Optional: ONE alpha with all three coders together.
